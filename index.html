<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>jaquedoces - Loja de Doces</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Pacifico&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');
  </script>

  <div class="top-bar">
    <div class="theme-toggle">
      <button id="btn-light" onclick="mudarTema('light')" title="Clarear"><i class="fas fa-sun"></i> Clarear</button>
      <button id="btn-dark" onclick="mudarTema('dark')" title="Escurecer"><i class="fas fa-moon"></i> Escurecer</button>
    </div>

    <button class="cart-btn" onclick="abrirCarrinho()" title="Ver Carrinho">
      <i class="fas fa-shopping-cart"></i>
      <span>Carrinho</span>
      <span id="cart-count">0</span>
    </button>
  </div>

  <header>
    <h1>jaquedoces</h1>
    <p>As melhores trufas artesanais da cidade</p>
  </header>

  <main>
    <div class="products-grid" id="products-grid"></div>
  </main>

  <div id="buy-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="buy-title">Opções de Compra</h2>
        <span class="close-btn" onclick="fecharOpcaoCompra()">&times;</span>
      </div>
      <div class="modal-body buy-options-body">
        <p class="buy-unit-price">Preço unitário: <span id="buy-price">R$ 0,00</span></p>
        <label for="buy-quantity">Escolha a quantidade:</label>
        
        <div class="quantity-selector">
          <button type="button" class="qtd-btn" onclick="alterarQtdCompra(-1)">-</button>
          <input type="number" id="buy-quantity" value="1" min="1" oninput="validarEAtualizarQtdManual()">
          <button type="button" class="qtd-btn" onclick="alterarQtdCompra(1)">+</button>
        </div>

        <p class="buy-subtotal" id="buy-subtotal">Subtotal: R$ 0,00</p>
      </div>
      <div class="modal-footer">
        <button class="cancel-btn" onclick="fecharOpcaoCompra()">Cancelar</button>
        <button class="add-cart-btn" onclick="confirmarAdicaoAoCarrinho()"><i class="fas fa-cart-plus"></i> Adicionar ao Carrinho</button>
      </div>
    </div>
  </div>

  <div id="cart-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2><i class="fas fa-shopping-cart"></i> Seu Carrinho</h2>
        <span class="close-btn" onclick="fecharCarrinho()">&times;</span>
      </div>
      <div class="modal-body" id="cart-items">
        <p class="empty-cart-msg">Seu carrinho está vazio.</p>
      </div>
      <div class="modal-footer">
        <div class="cart-total">
          <strong>Total:</strong> <span id="cart-total-price">R$ 0,00</span>
        </div>
        <button class="checkout-btn" onclick="finalizarPedido()">Finalizar Pedido</button>
      </div>
    </div>
  </div>

  <footer>
    <div class="social-media">
      <a href="https://www.tiktok.com/@jaquelinetaila?_r=1&_t=ZS-98hCdjyIsj4" target="_blank" rel="noopener noreferrer" class="social-icon tiktok" aria-label="TikTok">
        <i class="fab fa-tiktok"></i>
      </a>
      <a href="https://www.instagram.com/jaquedoces35?utm_source=qr&igsh=aTlvOG41ZDl0djkw" target="_blank" rel="noopener noreferrer" class="social-icon instagram" aria-label="Instagram">
        <i class="fab fa-instagram"></i>
      </a>
      <a href="https://www.facebook.com/share/1Pdi9wPCJV/" target="_blank" rel="noopener noreferrer" class="social-icon facebook" aria-label="Facebook">
        <i class="fab fa-facebook-f"></i>
      </a>
    </div>
    <div class="credits">
      desenvolvido por Gabriel Siqueira
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
